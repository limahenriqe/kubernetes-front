apiVersion: apps/v1

kind: Deployment

metadata: 
  name: kubernetes-front
  namespace: aluno13

spec: 
  replicas: 1

  selector: 
    matchLables:
      app: kubernetes-front

  template:
    metadata:
      labels:
        app: kubernetes-front

    spec:
      container:
      - name: kubernetes-front
        image: kubernetes-front
        imagePullpolicy: Never
        ports:
          - containerPort: 3000
